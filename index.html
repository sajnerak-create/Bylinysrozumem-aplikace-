<!DOCTYPE html>
<html lang="cs">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byliny s rozumem</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e7d46">

<style>
body{margin:0;background:#fff;color:#1d5c34;font:17px/1.5 "Segoe UI",system-ui,sans-serif}
#boot{max-width:560px;margin:0 auto;padding:32px 16px}
#boot img{width:120px;display:block;margin:0 auto 12px}
#boot h1{font-size:26px;margin:0 0 8px;text-align:center}
#boot label{display:block;margin:16px 0 4px;font-weight:600}
#boot input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfe3d5;border-radius:10px;font:inherit}
#boot button{margin-top:20px;padding:11px 18px;border:0;border-radius:10px;background:#2e7d46;color:#fff;font:inherit;font-weight:600}
#boot .muted{color:#4f7f5e;font-size:15px}
#boot .err{color:#8a3b1f}

<body>
<div id="boot"><p class="muted" style="text-align:center">Načítám…</p></div>
